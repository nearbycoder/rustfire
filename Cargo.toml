[package]
name = "rustfire"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nearbycoder/rustfire"
description = "An in-progress Rust implementation of ONCE Campfire"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
multer = "3.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "trace"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
bcrypt = "0.17"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
html-escape = "0.2"
httpdate = "1"
futures-util = "0.3"
form_urlencoded = "1"
ammonia = "4.2"
base64 = "0.22"
qrcodegen = "1.8"
reqwest = { version = "0.13", features = ["json", "stream"] }
regex = "1"
openssl = "0.10"
hkdf = "0.12"
http_02 = { package = "http", version = "0.2" }
sha2 = "0.10"
web-push = { version = "0.11", default-features = false }
scraper = "0.24"
ego-tree = "0.10"
encoding_rs = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
