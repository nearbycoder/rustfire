name: Rustfire checks
on:
  push:
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update
      - run: sudo apt-get install -y libvips-dev libvips-tools ffmpeg libssl-dev pkg-config
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo build
      - run: python3 tests/smoke.py
      - run: node tests/websocket.mjs
      - run: node --check static/app.js
